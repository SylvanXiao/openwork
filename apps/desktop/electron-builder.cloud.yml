extends: ./electron-builder.base.yml
appId: com.tgwork.app
productName: TGWork Cloud
extraMetadata:
  openworkDistribution: cloud
protocols:
  - name: TGWork Cloud
    schemes:
      - tgwork
publish:
  - provider: github
    owner: tgwork
    repo: tgwork
    releaseType: release
    channel: cloud
linux:
  executableName: tgwork-cloud
artifactName: tgwork-cloud-${os}-${arch}-${version}.${ext}
